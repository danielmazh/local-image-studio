<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Studio</title>
<style>
/* Dark is the default look. Light only when the system asks for light. */
:root {
  --bg: #121212; --panel: #1c1c1e; --field: #242427; --hover: #2c2c30; --ink: #f5f5f7; --muted: #9a9aa1;
  --line: rgba(255, 255, 255, .07); --accent: #F08A2C; --accent-ink: #1a1105; --accent-soft: rgba(240, 138, 44, .14);
  --ok: #5fd08a; --warn: #F08A2C; --bad: #ff7b72; --shade: rgba(0, 0, 0, .78); --r: 20px; --r-sm: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f3f3f5; --panel: #ffffff; --field: #f1f1f4; --hover: #e8e8ec; --ink: #17171a; --muted: #686870;
    --line: rgba(0, 0, 0, .08); --accent: #EE8124; --accent-ink: #1a1105; --accent-soft: rgba(238, 129, 36, .14);
    --ok: #1d7a45; --warn: #a85a00; --bad: #b42a26; --shade: rgba(10, 10, 12, .7); color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; height: 100vh;
  display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
code { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
code:not([dir]) { direction: ltr; unicode-bidi: isolate; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 16px; padding: 12px 24px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; width: 168px; flex: none; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.mark svg.i { width: 18px; height: 18px; stroke-width: 2; }
#status { flex: 1; text-align: center; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-inline-end: 8px; vertical-align: 1px; }
#status.busy::before { background: var(--warn); }
#status.down::before { background: var(--bad); }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); cursor: pointer; font-size: 14px; }
.link:hover { color: var(--ink); }
.link.acc { color: var(--accent); }
.langsw { display: flex; gap: 2px; background: var(--panel); border-radius: 99px; padding: 3px; flex: none; }
.langsw button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; height: 28px; min-width: 38px; padding: 0 10px; border-radius: 99px; }
.langsw button:hover { color: var(--ink); }
.langsw button.sel { background: var(--accent-soft); color: var(--accent); }
#off { display: flex; align-items: center; gap: 6px; color: var(--muted); padding: 8px 14px; border-radius: 99px; background: var(--panel); }
#off:hover { color: var(--bad); }
#off svg.i { width: 16px; height: 16px; }

/* ---------- shell: fixed left navigation + content ---------- */
.shell { flex: 1; min-height: 0; display: flex; }
.side { width: 200px; flex: none; padding: 4px 0 20px; padding-inline: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
.nav-i { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 14px; border: 0; background: none;
  color: var(--muted); font-size: 15px; font-weight: 600; cursor: pointer; text-align: start; white-space: nowrap; }
.nav-i:hover { background: var(--panel); color: var(--ink); }
.nav-i.on { background: var(--accent-soft); color: var(--accent); }
.mainc { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.view { display: none; }
#view-studio.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.page.on { display: block; flex: 1; min-height: 0; overflow-y: auto; }

/* ---------- studio tab strip ---------- */
.tabbar { display: flex; align-items: center; gap: 12px; padding: 0 0 12px; padding-inline-end: 20px; flex: none; }
.stabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: thin; }
.stab { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0; padding-inline: 14px 6px; border-radius: 12px; background: var(--panel);
  color: var(--muted); cursor: pointer; white-space: nowrap; max-width: 230px; font-size: 14px; flex: none; }
.stab .t { overflow: hidden; text-overflow: ellipsis; }
.stab:hover { color: var(--ink); }
.stab.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.stab .x { width: 26px; height: 26px; border-radius: 8px; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.stab .x:hover { background: var(--hover); color: var(--ink); }
.stab .x svg.i { width: 14px; height: 14px; }
.newtab { height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; font-weight: 600; white-space: nowrap; flex: none; }
.newtab:hover { background: var(--panel); color: var(--ink); }
.iter { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* ---------- studio layout ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 20px; padding: 0 0 20px; padding-inline-end: 20px; }
.flow { background: var(--panel); border-radius: 24px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.flowhead { padding: 22px 24px 0; }
.flowhead h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }

/* ---------- progress ---------- */
.progress { display: flex; margin: 18px 0 4px; }
.ps { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; color: var(--muted);
  font-size: 12px; background: none; border: 0; padding: 0; cursor: default; }
.ps::before { content: ""; position: absolute; top: 13px; inset-inline-start: -50%; width: 100%; height: 2px; background: var(--field); }
.ps:first-child::before { display: none; }
.ps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px;
  background: var(--field); position: relative; z-index: 1; }
.ps.done { color: var(--ink); cursor: pointer; }
.ps.done .n { background: var(--accent-soft); color: var(--accent); }
.ps.done::before, .ps.cur::before { background: var(--accent-soft); }
.ps.cur { color: var(--ink); font-weight: 600; }
.ps.cur .n { background: var(--accent); color: var(--accent-ink); }

/* ---------- steps ---------- */
.step { display: none; flex: 1; min-height: 0; flex-direction: column; }
.step.on { display: flex; }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 8px; }
.lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; text-align: center; }
.nav { flex: none; display: flex; gap: 10px; padding: 14px 24px 22px; }
.nav .btn { flex: 1; }
.nav .btn.primary { flex: 2; }
.msgline { text-align: center; font-size: 14px; white-space: pre-wrap; padding: 0 24px; }
.msgline:not(:empty) { padding-top: 8px; }
.msgline.bad { color: var(--bad); }
.msgline.ok { color: var(--ok); }
.center { text-align: center; }

/* ---------- buttons ---------- */
.btn { height: 54px; padding: 0 22px; border-radius: 16px; font-size: 16px; font-weight: 600; border: 0;
  background: var(--field); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: inherit; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.07); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { height: 40px; font-size: 14px; border-radius: 12px; padding: 0 16px; }
.btn.danger:hover:not(:disabled) { color: var(--bad); }
.btn.wide { width: 100%; }
.panel .btn:not(.primary), .item .btn:not(.primary) { background: var(--field); }

/* ---------- fields ---------- */
textarea, input[type=number], input[type=text], input[type=search], select { width: 100%; border: 1px solid transparent; border-radius: var(--r-sm);
  background: var(--field); padding: 14px 16px; outline: none; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }
textarea::placeholder, input::placeholder { color: var(--muted); }
/* dir="auto" fields are LTR while empty; the placeholder follows the page language */
[dir=rtl] textarea:placeholder-shown, [dir=rtl] input:placeholder-shown { direction: rtl; }
#prompt { min-height: 190px; resize: vertical; border-radius: var(--r); padding: 18px; font-size: 15px; line-height: 1.55; }

/* ---------- chat ---------- */
#s1 .body { display: flex; flex-direction: column; padding-bottom: 0; }
#log { flex: 1; min-height: 160px; overflow-y: auto; padding: 4px 0 12px; }
.m { padding: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.m.me { background: var(--field); border-radius: 16px; padding: 10px 14px; margin: 6px 0; margin-inline-start: 12%; }
.m.err { color: var(--bad); }
.m.sys { color: var(--muted); font-size: 13px; text-align: center; }
.m img { height: 64px; border-radius: 10px; margin: 8px 0 0; margin-inline-end: 8px; vertical-align: top; }
.dragging #log { outline: 2px dashed var(--accent); outline-offset: -2px; border-radius: var(--r-sm); }
.flow { padding: 18px 20px 14px; gap: 12px; }
.howto { flex: none; margin: 0; padding: 12px 34px 12px 16px; background: var(--field); border-radius: var(--r-sm); font-size: 15px; line-height: 1.6; }
.howto li::marker { color: var(--accent); font-weight: 700; }
.composer { flex: none; background: var(--field); border-radius: var(--r); padding: 10px; display: grid; gap: 10px; }
.cbtns { display: flex; gap: 10px; }
.cbtns > .btn, .attachwrap { flex: 1; }
.attachwrap { position: relative; display: flex; }
.attachwrap > .btn { flex: 1; background: var(--bg); }
.menu { position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 6px; display: grid; gap: 4px; z-index: 5; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.menu[hidden] { display: none; }
.menu button { height: 48px; border: 0; background: none; border-radius: 10px; cursor: pointer; font-size: 16px; }
.menu button:hover { background: var(--hover); }
.advlink { flex: none; text-align: center; }
.pend .num { position: absolute; bottom: -6px; inset-inline-start: -6px; width: 20px; height: 20px; font-size: 11px; background: var(--accent); color: var(--accent-ink); }
.m.job { background: var(--field); border-radius: 14px; padding: 12px 16px; margin: 8px 0; font-size: 14px; }
.m.job .jh { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.m.job .ji { color: var(--muted); }
.sh { font-size: 14px; color: var(--muted); font-weight: 600; margin: 22px 0 10px; }
.acts.mid { justify-content: center; margin-top: 12px; }
#picker { z-index: 22; }
.composer:focus-within { box-shadow: 0 0 0 1px var(--accent); }
#say { background: var(--bg); min-height: 56px; max-height: 180px; resize: none; padding: 12px 14px; font-size: 17px; }
.iconbtn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.iconbtn:hover:not(:disabled) { color: var(--ink); background: var(--hover); }
.iconbtn:disabled { opacity: .3; cursor: not-allowed; }
#send { background: var(--accent); color: var(--accent-ink); }
#send:disabled { opacity: .4; }
.pend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 10px; }
.pend:empty { display: none; }
.pend span { position: relative; }
.pend img { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; display: block; }
.pend button { position: absolute; top: -6px; inset-inline-end: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0;
  background: var(--ink); color: var(--bg); font-size: 12px; line-height: 20px; cursor: pointer; padding: 0; }
.pbthought summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.pbthought .pbthink { max-height: 240px; margin-bottom: 8px; }
.pbthink { max-height: 120px; overflow-y: auto; font-size: 12px; line-height: 1.4; color: var(--muted, #888); white-space: pre-wrap; }
.m .lab { font-size: 12px; font-weight: 650; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.autorun { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; cursor: pointer; }
.autorun small { display: block; color: var(--muted); font-size: 12px; }
.tools { display: flex; justify-content: center; gap: 18px; padding: 12px 0 2px; flex-wrap: wrap; }

/* ---------- photos ---------- */
.choices { display: grid; gap: 10px; }
.choices .btn { height: 60px; justify-content: flex-start; padding: 0 20px; font-size: 16px; }
#s2.hover .body { outline: 2px dashed var(--accent); outline-offset: -8px; border-radius: var(--r); }
.plist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.plist li { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-sm); background: var(--field); }
.num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 650; font-size: 13px; flex: none; }
.plist img { width: 52px; height: 52px; object-fit: cover; border-radius: 10px; flex: none; }
.plist code { flex: 1; min-width: 0; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.plist .iconbtn { width: 32px; height: 32px; }
.plist .iconbtn svg.i { width: 16px; height: 16px; }
.note { text-align: center; color: var(--muted); font-size: 13px; margin: 14px 0 0; }

/* ---------- option rows ---------- */
.rows { display: grid; gap: 8px; margin-top: 14px; }
.row { background: var(--field); border-radius: var(--r-sm); }
.rowhead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: none; border: 0;
  cursor: pointer; text-align: start; border-radius: var(--r-sm); }
.rowhead:hover { background: var(--hover); }
.rowhead .lbl { flex: 1; }
.rowhead .val { color: var(--muted); font-size: 14px; }
.rowhead .chev { transition: transform .15s; color: var(--muted); width: 16px; height: 16px; }
.row.open .chev { transform: rotate(90deg); }
[dir=rtl] .row:not(.open) .chev { transform: scaleX(-1); }
.row .pick { display: none; padding: 0 12px 12px; }
.row.open .pick { display: block; }
.seg { display: flex; gap: 4px; background: var(--bg); border-radius: 12px; padding: 4px; }
.seg button { flex: 1 1 0; min-width: 0; height: 40px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-size: 14px; color: var(--muted); padding: 0 6px; }
.seg button:hover { color: var(--ink); }
.seg button.sel { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: 1 1 30%; }
.sw { appearance: none; -webkit-appearance: none; flex: none; width: 44px; height: 26px; border-radius: 13px;
  background: var(--hover); position: relative; cursor: pointer; transition: background .15s; margin: 0; border: 0; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw:checked { background: var(--accent); }
.sw:checked::after { left: 21px; }
.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seedline { display: flex; align-items: center; gap: 12px; }
.seedline input[type=number] { background: var(--bg); height: 44px; padding: 8px 12px; }
.seedline input:disabled { opacity: .4; }
.rowhead select { width: auto; background: var(--bg); padding: 6px 10px; font-size: 14px; border-radius: 10px; }
.uses { margin-top: 14px; padding: 14px 16px; border-radius: var(--r-sm); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.uses b { color: var(--ink); font-weight: 600; }
.uses .link { font-size: 13px; }
.cmdlink { display: flex; justify-content: center; padding: 14px 0 4px; }

/* ---------- job list (step 4) ---------- */
.jobs { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.jobs li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--field); }
.jobs .what { flex: 1; min-width: 0; }
.jobs .what small { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.jobs .sec { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.dot { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
.dot.ok { color: var(--ok); } .dot.bad { color: var(--bad); } .dot.wait { color: var(--muted); }
.spin { width: 20px; height: 20px; border: 2.5px solid var(--hover); border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
#refine { margin-top: 16px; }

/* ---------- gallery ---------- */
.gallery { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 4px 0; }
.ghead h2 { margin: 0; font-size: 16px; font-weight: 600; }
.ghead span { color: var(--muted); font-size: 13px; }
.hero { position: relative; background: var(--panel); border-radius: 24px; overflow: hidden; flex: none;
  height: min(64vh, 720px); min-height: 280px; display: grid; place-items: center; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
.tags { position: absolute; top: 16px; left: 16px; display: flex; gap: 6px; flex-wrap: wrap; right: 16px; pointer-events: none; }
.tag { background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 99px; backdrop-filter: blur(6px); }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 20px 16px; color: #fff; font-size: 14px; line-height: 1.45;
  background: linear-gradient(transparent, rgba(0, 0, 0, .78)); display: flex; align-items: flex-end; gap: 12px; }
.cap p { flex: 1; margin: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; min-width: 0; }
.cap .acts { display: flex; gap: 8px; flex: none; }
.cap .btn.sm { background: rgba(255, 255, 255, .16); color: #fff; backdrop-filter: blur(6px); }
.cap .btn.sm:hover:not(:disabled) { background: rgba(255, 255, 255, .28); }
.placeholder { color: var(--muted); text-align: center; display: grid; gap: 12px; justify-items: center; padding: 20px; }
.placeholder svg.i { width: 40px; height: 40px; color: var(--accent); }
.placeholder .spin { width: 28px; height: 28px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; flex: none; }
.tile { position: relative; aspect-ratio: 1; border-radius: var(--r-sm); background: var(--panel); overflow: hidden; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--muted); font-size: 12px; outline: 2px solid transparent; outline-offset: -2px; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.sel { outline-color: var(--accent); }
.tile .gen { display: grid; gap: 6px; justify-items: center; }
.tile .gen svg.i { color: var(--accent); }
.foot { text-align: center; padding: 4px 0 2px; }

/* ---------- dashboard pages ---------- */
.wrap { max-width: 980px; margin: 0 auto; padding: 8px 24px 48px; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 8px 0 20px; }
.ph h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.015em; }
.ph p { margin: 4px 0 0; color: var(--muted); }
.panel { background: var(--panel); border-radius: var(--r); padding: 22px 24px; margin-bottom: 16px; }
.panel > h2, .sect > h2 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }
.panel > .sub, .sect > .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
.sect { margin: 28px 0 8px; }
.strip { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font-size: 22px; font-weight: 650; }
.stat span { color: var(--muted); font-size: 13px; }
.list { display: grid; gap: 10px; }
.item { background: var(--panel); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 10px; min-width: 0; }
.ihead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ihead .name { font-weight: 650; font-size: 16px; margin-inline-end: 4px; overflow-wrap: anywhere; }
.ihead .when { color: var(--muted); font-size: 13px; margin-inline-end: 4px; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--field); color: var(--muted); white-space: nowrap; }
.badge.acc { background: var(--accent); color: var(--accent-ink); }
.badge.ok { background: rgba(95, 208, 138, .14); color: var(--ok); }
.badge.warn { background: var(--accent-soft); color: var(--accent); }
.badge.bad { background: rgba(255, 123, 114, .14); color: var(--bad); }
.meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.desc { margin: 0; color: var(--muted); font-size: 14px; }
/* catalog notes and numbers with units: direction from their own text, not from the page */
.desc, .meta, .stat b { unicode-bidi: plaintext; }

<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
// Optional add-on hooks: an extra script may set window.studioHooks = { name(...args) {...} }.
// Names used here: state, title, tile, downloadButton, confirmClose, doneButton, modelsTop,
// modelChanges, systemPaths. A missing hook does nothing.
const hook = (name, ...args) => {
  const f = (window.studioHooks || {})[name];
  return typeof f === "function" ? f(...args) : undefined;
};
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-Studio-Token": TOKEN, ...(opts.headers || {}) } });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString(LANG, { dateStyle: "medium", timeStyle: "short" }) : "";
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

async function getJSON(path) {
  const r = await api(path); let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || "HTTP " + r.status);
  return j;
}
async function postJSON(path, body) {
  const r = await api(path, { method: "POST", body: JSON.stringify(body || {}), headers: { "Content-Type": "application/json" } });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok || (j && j.error)) throw new Error((j && j.error) || "HTTP " + r.status);
  return j;
}
let toastTimer;
function toast(text, bad = false) {
  const t = $("toast"); t.textContent = text; t.className = "on" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "", bad ? 6000 : 3000);
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast(t("copy.done", { what })); } catch { toast(t("copy.failed"), true); }
}

// ---------- languages ----------
// All UI text lives in portal/i18n/en.json and he.json (same keys; scripts/check-i18n.py checks them).
// Static HTML: data-i18n (text), data-i18n-title, data-i18n-placeholder, data-i18n-aria. Code: t(key, vars).
// tn(key, n) picks key.one or key.other. The choice is kept in localStorage when it works.
let LANG = "en", STR = {}, STR_EN = {};
const DICTS = {};
function t(key, vars) {
  let s = STR[key] ?? STR_EN[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
  return s;
}
const tn = (key, n, vars = {}) => t(key + (n === 1 ? ".one" : ".other"), { n, ...vars });
const useText = (m) => (LANG === "he" ? m.use_he || m.use_en : m.use_en || m.use_he) || "";
function applyStatic(root = document) {
  root.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  root.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  root.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  root.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
}
async function loadDict(l) {
  if (!DICTS[l]) DICTS[l] = await getJSON(`/i18n/${l}.json`);
  return DICTS[l];
}
async function setLang(l, redraw = true) {
  l = l === "he" ? "he" : "en";
  try {
    STR_EN = await loadDict("en");
    STR = await loadDict(l);
  } catch (e) {
    if (Object.keys(STR_EN).length) toast(t("lang.failed", { msg: e.message }), true);
    return;
  }
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "he" ? "rtl" : "ltr";
  try { localStorage.setItem("studio.lang", l); } catch { /* works without it */ }
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("sel", b.dataset.lang === l));
  applyStatic();
  if (redraw) redrawAll();
}
$("langsw").onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.lang !== LANG) setLang(b.dataset.lang); };
function shq(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

// ---------- line icons (inline SVG paths) ----------
const ICONS = {
  sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  power: '<path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/>',
  clip: '<path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>',
  send: '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
  up: '<path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>',
  upload: '<path d="M12 15V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  copies: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  frame: '<rect x="4" y="6" width="16" height="12" rx="2.5"/><path d="M8 10v-1h2M16 14v1h-2"/>',
  gauge: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8"/><circle cx="15" cy="15" r=".8"/><circle cx="15" cy="9" r=".8"/><circle cx="9" cy="15" r=".8"/>',
  face: '<circle cx="12" cy="12" r="8"/><path d="M9 10h.01M15 10h.01"/><path d="M9 14.5a4 4 0 0 0 6 0"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 20a8 6 0 0 1 16 0"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.2h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  image: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M20 15l-5-5-9 9"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17.5h.01"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
};
const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
function paintIcons(root = document) {
  root.querySelectorAll("[data-i]").forEach(el => {
    const html = icon(el.dataset.i, el.dataset.c || "");
    if (el.tagName === "SPAN" && !el.classList.contains("mark")) el.outerHTML = html; else el.insertAdjacentHTML("afterbegin", html);
  });
}
paintIcons();

// ======================================================================
// Main views (fixed left navigation)

// ---------- status ----------
// Off state: two failed status checks in a row (5 s apart) show the off page.
// While off, /ping is checked every 5 s; when it answers, /launch reloads the portal.
let fails = 0, isDown = false, sawFail = false;
function showDown(afterTurnOff = false) {
  if (isDown) return;
  isDown = true; sawFail = !afterTurnOff;
  document.querySelectorAll(".over.on").forEach(o => o.classList.remove("on"));
  $("down").classList.add("on");
  const ping = async () => {
    try {
      await fetch(location.origin + "/ping", { mode: "no-cors", cache: "no-store" });
      if (sawFail) { location.href = "/launch"; return; }
    } catch { sawFail = true; }
    setTimeout(ping, 5000);
  };
  setTimeout(ping, afterTurnOff ? 3000 : 5000);
}
async function refresh() {
  if (isDown) return;
  try {
    const r = await api("/api/state");
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json(); fails = 0;
    hook("state", state);
    const mem = state.loaded.map(m => `${m.name.split("/").pop()} ${m.size}`).join(", ") || t("status.none");
    const srvOff = state.server_up === false;  // the portal runs, the image server does not
    $("status").textContent = srvOff ? t("status.serverOff")
      : (state.busy ? t("status.generating") : t("status.on")) + "  |  " + t("status.mem", { list: mem });
    $("status").className = srvOff ? "down" : state.busy ? "busy" : "";
  } catch {
    $("status").textContent = t("status.offline"); $("status").className = "down"; state = state && { ...state, offline: true };
    if (++fails >= 2) showDown();
  }
  drawUses(); pbDrawModel();
  if (view === "system") drawSystem();
  if (view === "models" && state) $("mmem").textContent = memText();
}

// ---------- uploads ----------
// Every failure shows a message (a network error or a bad answer used to fail silently).
// HEIC, TIFF, GIF, BMP and AVIF are saved as JPEG by the server, so the models can read them.
const MAX_UPLOAD_MB = 40;
async function upload(files) {
  const out = [], list = [...files].filter(Boolean);
  if (!list.length) return out;
  toast(tn("upload.busy", list.length));
  for (const f of list) {
    const name = f.name || "image";
    if (f.size > MAX_UPLOAD_MB * 1024 * 1024) { toast(t("upload.tooBig", { name, mb: MAX_UPLOAD_MB }), true); continue; }
    let r, j = {};
    try {
      r = await api("/api/upload", { method: "POST", body: f, headers: { "X-File-Name": encodeURIComponent(name), "Content-Type": f.type || "application/octet-stream" } });
      try { j = await r.json(); } catch { /* not JSON: the status says enough */ }
    } catch (e) { toast(t("upload.network", { name, msg: e.message }), true); continue; }
    if (!r.ok || !j.path) {
      const why = j.code === "type" ? t("upload.notImage", { name, ext: j.ext || "?" }) : j.code === "broken" ? t("upload.broken", { name })
        : j.code === "big" ? t("upload.tooBig", { name, mb: MAX_UPLOAD_MB }) : r.status === 403 ? t("upload.expired")
        : t("upload.failed", { name, msg: j.error || "HTTP " + r.status });
      toast(why, true); continue;
    }
    out.push(j);
  }
  if (out.length) toast(tn("upload.done", out.length));
  return out;
}

function dropZone(zone, input, handler) {

  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("hover"); });
  zone.addEventListener("dragleave", (e) => { if (!zone.contains(e.relatedTarget)) zone.classList.remove("hover"); });
  zone.addEventListener("drop", async (e) => { e.preventDefault(); e.stopPropagation(); zone.classList.remove("hover"); handler(await upload([...e.dataTransfer.files])); });
}

let nRef = 0;
// The director chats, and after the user approves in words it runs the image model itself,
// streams the progress, then reviews the results. Events: t, error, final, job, progress,
// results, phase, append, done.
// Stop: the job stops on the server (finished images stay), the chat stream is aborted.
// With a running job the stream gets a moment to deliver the server's own history first.
let chatAbort = null;
const isFinished = (st) => st === "done" || st === "lost" || st === "stopped";
const jobLive = () => !!(curJob && !isFinished(curJob.status));
const busyHere = () => chatBusy || jobLive();
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function stopNow() {
  const id = jobLive() ? curJob.id : null;
  // A known job stops by id. Without one only the stream is aborted: the server then stops
  // the job it started for this chat, and a job of another tab is never touched.
  if (id) { try { await postJSON(`/api/job/${id}/stop`, {}); } catch (e) { console.warn("stop failed", e); } }
  if (chatBusy && id) for (let i = 0; i < 40 && chatBusy; i++) await sleep(100);
  if (chatBusy && chatAbort) chatAbort.abort();
  for (let i = 0; i < 50 && chatBusy; i++) await sleep(100);
  updateStop();
}
// The send button becomes Stop while busy and the input is empty; Generate in Advanced too
function updateStop() {
  const stop = busyHere() && !$("say").value.trim() && !pending.length;
  const b = $("send");
  b.classList.toggle("stop", stop); b.classList.toggle("primary", !stop);
  b.innerHTML = stop ? icon("stop") + esc(t("studio.stop")) : esc(t("studio.send"));
  b.title = stop ? t("studio.stop.title") : t("studio.send.title");
  const g = $("gen"), live = jobLive();
  g.classList.toggle("stop", live);
  $("gentext").textContent = live ? t("studio.stop") : tn("adv.generate", count);
}
async function send(text, hidden = false, extraRefs = null) {
  if (chatBusy) return;
  const att = extraRefs ? [] : pending.splice(0); drawPending();
  let content = text;
  if (att.length) content += "\n" + att.map(r => `[attached ref ${++nRef}: ${r.path}]`).join("\n");
  messages.push({ role: "user", content, refs: extraRefs || att.map(r => r.path), ...(hidden ? { hidden: true } : {}) });
  const base = messages.length;
  if (!hidden) { line("user", text, att); autoTitle(text); }
  chatBusy = true; chatAbort = new AbortController(); updateStop();
  const auto = true;  // the director always runs the image model after approval
  const review = !!extraRefs;  // a review only comments: it never starts images by itself
  let bub = bubble(extraRefs ? t("chat.reviewLabel") : ""), reply = "", final = null, jobStarted = false, append = null, aborted = false, resultFiles = null;
  const replies = [];
  try {
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ messages, chat_id: chatId, tab_id: curTab, auto_run: auto && !review, review,
      refine: $("refine").checked, creativity, count: imgCount, models: modelsBody() }),
      headers: { "Content-Type": "application/json" }, signal: chatAbort.signal });
    if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const ln = buf.slice(0, i); buf = buf.slice(i + 1); if (!ln.trim()) continue;
        let ev; try { ev = JSON.parse(ln); } catch { continue; }
        if (typeof ev.t === "string") { reply += ev.t; bub.set(stripFinal(reply) || "..."); }
        if (ev.error && !ev.done) line("error", t("chat.problem", { msg: ev.error }));
        if (ev.final) {
          final = ev.final; applyFinal(final, true);
          if (!review) line("sys", t("chat.approved"));  // a review never runs: chat.reviewPrompt says so at the end
        }
        if (ev.job) {
          jobStarted = true; jobRunning = true; hasJob = true; jobLine = null;
          const sp = ev.job.spec;
          curJob = { id: ev.job.id, spec: sp, models: ev.job.models, status: "running", items: (sp.seeds || []).map(s => ({ seed: s, status: "queued", seconds: 0 })) };
          showJob(curJob); updateStop();
        }
        if (ev.progress && curJob) { curJob.items = ev.progress; showJob(curJob); }
        if (ev.results && curJob) {
          resultFiles = ev.results; if (ev.quality) curJob.quality = ev.quality;

function treeHtml(files, localOnly) {
  const root = { dirs: {}, files: [] };
  for (const f of files) {
    const parts = f.split("/"); let n = root;
    parts.forEach((p, i) => { if (i === parts.length - 1) n.files.push(p); else n = n.dirs[p] = n.dirs[p] || { dirs: {}, files: [] }; });
  }
  const local = new Set(localOnly.map(x => x.replace(/\/$/, "")));
  for (const l of local) if (!root.dirs[l]) root.dirs[l] = { dirs: {}, files: [], onlyLocal: true };
  const tagLocal = `<span class="badge warn">${esc(t("help.localOnly"))}</span>`;
  const render = (node, depth) => {
    const dirs = Object.keys(node.dirs).sort().map(name => {
      const d = node.dirs[name];
      const tag = depth === 0 && local.has(name) ? tagLocal : "";
      const kids = d.onlyLocal ? "" : render(d, depth + 1);
      return kids ? `<details${depth === 0 ? "" : ""}><summary>${icon("folder")}<b>${esc(name)}/</b> ${tag}</summary><div class="kids">${kids}</div></details>`
        : `<div class="f">${icon("folder")}<b>${esc(name)}/</b> ${tag}</div>`;
    }).join("");
    const fl = node.files.filter(f => f !== ".gitkeep").sort().map(f => `<div class="f">${icon("file")}${esc(f)}</div>`).join("");
    return dirs + fl;
  };
  return render(root, 0);
}
// opts.ex (Examples in Help): dir="auto" on text, ```try boxes, ```text with a copy button
function md(src, opts = {}) {
  const D = ' dir="auto"';  // docs may be English inside a Hebrew page, or the other way round
  const TRY = esc(t("ex.try")), COPY = esc(t("common.copy"));
  const lines = esc(src).replace(/\r/g, "").split("\n");
  const out = []; let para = [], list = null, i = 0;
  const flushP = () => {
    if (!para.length) return;
    const h = inline(para.join(" ")); para = [];
    out.push(/^(\s*<img [^>]*>\s*)+$/.test(h) ? `<div class="imgrow">${h}</div>` : `<p${D}>${h}</p>`);
  };
  const flushL = () => { if (list) { out.push(`<${list.tag}${list.start > 1 ? ` start="${list.start}"` : ""}${D}>${list.items.map(t => `<li${D}>${inline(t)}</li>`).join("")}</${list.tag}>`); list = null; } };
  const cells = (s) => s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  while (i < lines.length) {
    const raw = lines[i], t = raw.trim();
    let m;
    if (t.startsWith("```")) {
      flushP(); flushL();
      const lang = t.slice(3).trim().toLowerCase();
      const ind = raw.search(/\S/); const code = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) { const l = lines[i]; code.push(l.slice(Math.min(ind, Math.max(0, l.search(/\S/))))); i++; }
      i++;
      const body = code.join("\n");
      if (opts.ex && lang === "try") out.push(`<div class="trybox"><blockquote dir="auto">${body}</blockquote><button class="btn sm primary trybtn">${TRY}</button></div>`);
      else if (opts.ex) out.push(`<div class="codewrap"><pre><code dir="auto">${body}</code></pre><button class="btn sm copybtn">${COPY}</button></div>`);
      else out.push(`<pre><code>${body}</code></pre>`);
      continue;
    }
    if (!t) { flushP(); if (list && i + 1 < lines.length && /^\s+\S/.test(lines[i + 1])) { i++; continue; } flushL(); i++; continue; }
    if ((m = t.match(/^(#{1,6})\s+(.*)$/))) { flushP(); flushL(); const lv = Math.min(6, m[1].length + 1); out.push(`<h${lv}${D}>${inline(m[2])}</h${lv}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})$/.test(t)) { flushP(); flushL(); out.push("<hr>"); i++; continue; }
    if (t.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1].trim())) {
      flushP(); flushL();
      const head = cells(t); i += 2; const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map(c => `<th${D}>${inline(c)}</th>`).join("")}</tr></thead><tbody>`
        + rows.map(r => `<tr>${r.map(c => `<td${D}>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>");
      continue;
    }
    if ((m = t.match(/^([-*+]|\d+[.)])\s+(.*)$/))) {
      flushP();
      const tag = /\d/.test(m[1]) ? "ol" : "ul";
      if (list && list.tag !== tag && raw.search(/\S/) === 0) flushL();
      if (!list) list = { tag, items: [], start: tag === "ol" ? parseInt(m[1], 10) : 1 };
      list.items.push(m[2]); i++; continue;
    }
    if (list && /^\s/.test(raw)) { list.items[list.items.length - 1] += " " + t; i++; continue; }
    if (t.startsWith("&gt;")) { flushL(); para.push(t.replace(/^&gt;\s?/, "")); i++; continue; }
    flushL(); para.push(t); i++;
  }
  flushP(); flushL();
  return out.join("\n");
}

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0001${codes.length - 1}\u0001`; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, u) => /^docs\/examples\/[A-Za-z0-9._-]+\.(?:jpg|png)$/.test(u)
    ? `<img class="mdimg" src="/${u}" alt="${alt}" loading="lazy">` : alt);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : t);
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  s = s.replace(/\u0001(\d+)\u0001/g, (_, n) => `<code>${codes[+n]}</code>`);
  return s;
}

// A reply: plain text, and every ```prompt block as a box with Copy and Send to Studio

  for (const m of text.matchAll(PB_BLOCK)) {

    const prompt = m[1].trim();

    const q = document.createElement("blockquote"); q.dir = "auto"; q.textContent = prompt;
    const acts = document.createElement("div"); acts.className = "acts";
    const copy = document.createElement("button"); copy.className = "btn sm"; copy.textContent = t("common.copy");
    copy.onclick = () => copyText(prompt, t("copy.what.prompt"));
    const toStudio = document.createElement("button"); toStudio.className = "btn sm primary"; toStudio.textContent = t("pb.toStudio");
    toStudio.title = t("pb.toStudio.title");

async function pbSend() {

  $("pbsay").value = ""; $("pbsay").oninput();
  if (!pb.messages.length) $("pblog").replaceChildren();
  pb.messages.push({ role: "user", content: text }); pbLine("user", text);
  pb.busy = true; pb.abort = new AbortController(); pbButtons();
  const d = pbLine("bot", ""); d.innerHTML = '<div class="spin"></div>';
  let reply = "", thought = "", aborted = false, err = null;
  try {
    const r = await api("/api/prompt-builder", { method: "POST", body: JSON.stringify({ messages: pb.messages, chat_id: pb.chatId, mode: pbMode(), think: $("pbthinksw").checked,
      models: pbChosen() ? { chat: pbChosen().id } : undefined }),
      headers: { "Content-Type": "application/json" }, signal: pb.abort.signal });
    if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const ln = buf.slice(0, i); buf = buf.slice(i + 1); if (!ln.trim()) continue;
        let ev; try { ev = JSON.parse(ln); } catch { continue; }
        if (ev.think && !reply) {
          thought += ev.think;
          if (!d.querySelector(".pbthink")) d.innerHTML = `<div class="lab">${esc(t("pb.thinking"))}</div><div class="pbthink"></div>`;
          const th = d.querySelector(".pbthink"); th.textContent = thought; th.scrollTop = th.scrollHeight; pbScroll();
        }
        if (typeof ev.t === "string") { reply += ev.t; d.textContent = reply; pbScroll(); }
        if (ev.error) err = ev.error;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") aborted = true; else err = e.message;
  }
  if (reply) { pb.messages.push({ role: "assistant", content: reply }); pbRender(d, reply);
    if (thought.trim()) { const det = document.createElement("details"); det.className = "pbthought";
      det.innerHTML = `<summary>${esc(t("pb.thought"))}</summary><div class="pbthink"></div>`;
      det.querySelector(".pbthink").textContent = thought.trim(); d.prepend(det); } if (aborted) d.appendChild(document.createTextNode(" " + t("chat.stopped"))); }
  else { d.remove(); if (aborted) pbLine("sys", t("chat.stopped")); }  // stopped while it was still thinking
  if (err) pbLine("error", t("chat.problem", { msg: err }));
  pb.busy = false; pb.abort = null; pbButtons(); pbScroll();
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".over.on:not(#down)").forEach(o => o.classList.remove("on")); });
async function turnOff() {
  if (!confirm(t("off.confirm"))) return;
  try { await saveNow(); } catch {}
  try { await api("/api/off", { method: "POST" }); } catch {}
  showDown(true);
}
$("off").onclick = turnOff;
$("off2").onclick = turnOff;

// ---------- language switch: redraw every text that code wrote, keep all tab state ----------
function redrawAll() {
  document.title = hook("title") || "Image Studio";
  drawRefine(); drawImgCount(); drawModelRow(); drawPending();
  const was = restoring; restoring = true; drawRefs(); restoring = was;  // no save, only texts
  syncOptions(); drawStrip();
  const menu = $("mmenu");
  if (!menu.hidden && menu.dataset.role) { menu.hidden = true; openModelMenu(menu.dataset.role); }
  if (!chatBusy) {
    drawLog();
    if (curJob) { jobLine = null; showJob(curJob); } else drawGallery();
  } else {  // a reply is streaming: only the greeting changes
    const g = $("log").querySelector(".greet > div:last-child"); if (g) g.textContent = t("chat.greeting");
    drawGallery(jobLive());
  }
  if ($("picker").classList.contains("on") && pick.data) drawPicker();
  if (view === "history") loadHistory();
  if (view === "models" && modelsData) drawModels();
  if (view === "system") drawSystem();
  if (view === "help") loadHelp();
  pbRedraw();
  if (state) refresh();
}

// ---------- start ----------
(async () => {
  let l = "en";
  try { l = localStorage.getItem("studio.lang") || "en"; } catch { /* private mode: English */ }
  await setLang(l, false);
  if (!Object.keys(STR_EN).length) applyStatic();  // no strings: keys show, the portal still works
  showView("studio");
  drawGallery(); pbRedraw();
  refresh(); setInterval(refresh, 5000);
  loadCatalog();
  loadRecent();
  initTabs();
})();
</script>
